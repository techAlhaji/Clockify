<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Radar rings -->
  <circle cx="16" cy="18" r="12" stroke="url(#ring1)" stroke-width="0.7" opacity="0.4"/>
  <circle cx="16" cy="18" r="8" stroke="url(#ring1)" stroke-width="0.7" opacity="0.6"/>
  <circle cx="16" cy="18" r="4.5" stroke="url(#ring1)" stroke-width="0.7" opacity="0.9"/>
  <!-- Clock face -->
  <circle cx="16" cy="16" r="10" stroke="url(#grad)" stroke-width="1.5" fill="none" opacity="0.9"/>
  <!-- Hour hand -->
  <line x1="16" y1="16" x2="16" y2="10" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.95"/>
  <!-- Minute hand -->
  <line x1="16" y1="16" x2="21" y2="16" stroke="url(#grad)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="1.5" fill="white"/>
  <!-- Location pin top -->
  <circle cx="16" cy="7" r="2" fill="url(#grad2)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ring1" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
</svg>
